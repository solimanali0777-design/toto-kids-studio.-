name: Core Resilience Check

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/core-resilience.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/core-resilience.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check new resilience modules
        run: |
          node --check backend/workContinuity.mjs
          node --check backend/selfRepairLoop.mjs
          node --check backend/modelRouter.mjs
          node --check backend/educationPolicy.mjs
      - name: Run resilience tests
        run: node --test tests/resilience.test.mjs
